# Configuration for the Genizah semantic-retrieval pilot.
#
# This file is read by every stage of the pipeline (see README.md for the
# stage list). Nothing below is executed against real data yet: as of the
# initial scaffold, no Friedberg bibliographic corpus is present under
# data/, so run_experiment.py stops after the data-inspection stage and
# reports what is missing (see results/data_profile.md).

data:
  # Path to the bibliographic corpus. Expected formats: .csv, .tsv, .json,
  # .jsonl, or .bib (BibTeX). See data/README.md for the field schema this
  # pipeline expects once a real file is placed here.
  input_path: "data/friedberg_bibliography.csv"
  # Optional cap so a first run stays a genuine pilot, not the whole database.
  max_records: 500
  min_records: 100

representation:
  # "title_only" (Representation A) or "bibliographic_text" (Representation B).
  # See README.md section "What counts as a document" for the exact field list.
  mode: "bibliographic_text"
  fields:
    title_only: ["title"]
    bibliographic_text:
      - title
      - authors
      - venue
      - year
      - keywords
      - abstract
      - notes
  # Fields that are never used as document text because they would leak the
  # answer we're trying to discover independently (e.g. a pre-assigned
  # subject/topic category).
  excluded_fields: ["subject_category", "topic_label"]

preprocessing:
  # Conservative by design (spec section 7): no stemming, no translation,
  # no rewriting unless explicitly turned on here, and only ever per-language.
  lowercase: true
  strip_diacritics: false
  stem: false
  translate: false
  per_language_notes: "To be filled in once the corpus's actual language mix is known (see data_profile.md)."

lexical_baseline:
  method: "tfidf"        # "tfidf" or "bm25"
  ngram_range: [1, 2]
  min_df: 1
  bm25:
    k1: 1.5
    b: 0.75

semantic:
  # Multilingual model capable of representing both Hebrew and English.
  # Placeholder pending an explicit model decision — do not treat this as
  # already validated. Candidate: a Sentence-Transformers multilingual model.
  model_name: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
  model_version: null      # fill in the exact revision/commit hash once pinned
  embedding_dimensionality: 768
  normalize_embeddings: true
  similarity: "cosine"

experiment:
  random_seed: 42
  n_seed_publications: 40   # within the 30-50 range specified
  top_k: 10

clustering:
  enabled: false            # only turn on after retrieval has been validated
  method: "umap"            # "umap" or "pca"
  n_components: 2

output:
  results_dir: "results"
