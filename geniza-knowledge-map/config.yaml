# Configuration for the Geniza Knowledge Map (PGP prototype).
#
# This is a separate project from ../geniza-semantic-retrieval/ (the planned
# FGP bibliography experiment). The corpus here is the public Princeton
# Geniza Project (PGP) metadata export — see README.md section 0.

data:
  # Where the raw PGP metadata CSVs live. Fetch with:
  #   git clone --depth 1 https://github.com/princetongenizalab/pgp-metadata data/raw/pgp-metadata
  raw_dir: "data/raw/pgp-metadata/data"
  processed_dir: "data/processed"

sample:
  # Spec section 5: start with 1,000-5,000 documents, reproducibly.
  mode: "random"          # "random" | "by_type" | "manual_ids"
  n_documents: 1500
  random_seed: 42
  # mode: "by_type" draws evenly across documents.csv's `type` categories
  # instead of pure random, for topical diversity.
  # mode: "manual_ids" reads data/manual_ids.csv (one pgpid per line).
  manual_ids_path: "data/manual_ids.csv"

graph:
  # Only edge types justified by the source data (see results/pgp_data_profile.md).
  # PERSON edges are intentionally absent — this export has no document<->person
  # join key, only aggregate counts in people.csv.
  edge_types:
    - associated_with_place     # documents.csv role columns -> places.csv
    - cited_by_publication      # footnotes.csv -> sources.csv
    - shares_fragment           # fragments.csv pgpids list

output:
  results_dir: "results"
  webapp_data_dir: "webapp/data"
